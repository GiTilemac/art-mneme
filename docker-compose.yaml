# The app and its own PostgreSQL. Start with `docker compose up --build`, then open http://localhost:8000.
# APP_PORT changes the port on your computer, e.g. `APP_PORT=8001 docker compose up --build`.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: artmneme
      POSTGRES_PASSWORD: artmneme
      POSTGRES_DB: artmneme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "artmneme", "-d", "artmneme"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://artmneme:artmneme@postgres:5432/artmneme
      PHOTO_DIR: /data/photos
    volumes:
      - photos:/data/photos
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres-data:
  photos:
