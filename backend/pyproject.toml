[project]
name = "art-mneme-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
