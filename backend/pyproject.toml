[project]
name = "art-mneme-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# `make integration` runs integration/ against the docker-compose.yaml stack.
testpaths = ["tests"]
