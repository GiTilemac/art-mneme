# Manual deploy to prod (the AWS stack artmneme): Actions > "Deploy to prod" > Run workflow, on main.
# Deploy stage only: it builds nothing. It starts the image tagged "dev" in ECR (the newest image that CI built
# from main after all tests passed), or the image tag entered (YYYYMMDD-HHMMSS-shortsha), e.g. to roll back.
# AWS access: the repository variable AWS_DEPLOY_ROLE_ARN_PROD (deploy/github-oidc.yaml; trusts runs on main).
name: Deploy to prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (empty = the image tagged dev)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

# One deploy at a time; a second one waits.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  STACK: artmneme

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The full history, so deploy.sh can take the deploy files from the image's own commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - run: deploy/deploy.sh "$TAG"
        env:
          TAG: ${{ inputs.tag }}
      - name: Check that prod is healthy
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS -m 10 "$url/api/health" || true)" = '{"status":"ok"}' ]; then
              echo "Healthy: $url"; exit 0
            fi
            sleep 5
          done
          echo "No healthy answer from $url/api/health after 150 seconds"; exit 1
