# Manual deploy to prod (the AWS stack artmneme): Actions > "Deploy to prod" > Run workflow, on main.
# It deploys the newest commit of main, or the commit given, but only if the CI workflow passed for it.
# AWS access: the repository variable AWS_DEPLOY_ROLE_ARN_PROD (deploy/github-oidc.yaml; trusts runs on main).
name: Deploy to prod

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to deploy (empty = the newest commit of main)
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

# One deploy at a time; a second one waits.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  STACK: artmneme

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Choose the commit and check that CI passed for it
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          sha=$(git rev-parse --verify "${COMMIT:-origin/main}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main"; exit 1; }
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml/runs?head_sha=$sha&event=push" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion')
          [ "$result" = success ] || { echo "CI has not passed for $sha (result: ${result:-no run})"; exit 1; }
          git checkout --quiet "$sha"
          echo "Deploying $sha"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - run: deploy/deploy.sh
      - name: Check that prod is healthy
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS -m 10 "$url/api/health" || true)" = '{"status":"ok"}' ]; then
              echo "Healthy: $url"; exit 0
            fi
            sleep 5
          done
          echo "No healthy answer from $url/api/health after 150 seconds"; exit 1
