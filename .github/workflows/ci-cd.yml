# Tests on every push and pull request. On a push to main, after all tests pass, the build stage pushes the image
# to ECR (YYYYMMDD-HHMMSS-shortsha) and tags it "dev". Nothing is deployed here: dev runs locally, and prod gets
# an image only with the manual workflow "Deploy to prod" (deploy-prod.yml).
name: CI

# A push or pull request that changes only docs starts no run: docs cannot change tests or the image.
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artmneme
          POSTGRES_PASSWORD: artmneme
          POSTGRES_DB: artmneme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artmneme -d artmneme_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://artmneme:artmneme@localhost:5432/artmneme_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.0"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # The docker-compose.yaml stack, tested over HTTP and in a real browser.
  stack-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.0"
      - run: uv sync --frozen && uv run playwright install --with-deps chromium
        working-directory: backend
      - run: make integration
      - run: make e2e

  # Build stage: the image of this commit, pushed to ECR. Only on main, and only after every test passed.
  build:
    needs: stack-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: eu-central-1
      - run: deploy/build.sh
